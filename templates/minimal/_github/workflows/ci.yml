name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Read SDK version
        id: sdk-version
        run: echo "version=$(grep '^sdk-version' daml.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Daml SDK
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.daml
          key: daml-sdk-${{ steps.sdk-version.outputs.version }}

      - name: Install Daml SDK
        run: |
          if [ ! -f ~/.daml/bin/daml ]; then
            curl -sSL https://get.daml.com/ | bash
            export PATH="$HOME/.daml/bin:$PATH"
            daml install ${{ steps.sdk-version.outputs.version }}
          else
            echo "Daml SDK found in cache"
          fi
          echo "$HOME/.daml/bin" >> $GITHUB_PATH

      - name: Build
        run: daml build

      - name: Test
        run: daml test

      - name: Upload DAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: .daml/dist/*.dar
